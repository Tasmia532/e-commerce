<div class="container my-4">
<div class="mb-4">
<img src="assets/header.jpg" alt="Header" class="w-100 rounded shadow">

</div>

  <!-- Filter Bar -->
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 p-3 bg-light rounded shadow-sm">
    <!-- Category Filter -->
    <div class="d-flex align-items-center gap-2">
      <label class="fw-semibold me-2 text-secondary">Category:</label>
      <select class="form-select form-select-sm border-0 shadow-sm" style="width: 180px;"
              [(ngModel)]="selectedCategory" 
              (change)="applyFilters()">
        <option value="">All</option>
        <option *ngFor="let cat of ['Electronics','Clothing','Books']" [value]="cat">
          {{ cat }}
        </option>
      </select>
    </div>

    <!-- Price Sort -->
    <div class="d-flex align-items-center gap-2">
      <label class="fw-semibold me-2 text-secondary">Sort by:</label>
      <select class="form-select form-select-sm border-0 shadow-sm" style="width: 180px;"
              [(ngModel)]="priceSort" 
              (change)="applyFilters()">
        <option value="">Default</option>
        <option value="asc">Price: Low → High</option>
        <option value="desc">Price: High → Low</option>
      </select>
    </div>
  </div>

  <!-- Products Grid -->
  <div class="row g-3">
    <div *ngFor="let product of filteredProducts" class="col-6 col-md-4 col-lg-3">
      <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden hover-shadow">
        <!-- Product Image -->
        <img [src]="product.imageUrl || 'assets/no-image.png'" 
             class="card-img-top" 
             alt="{{ product.name }}" 
             style="height: 170px; object-fit: cover;">

        <div class="card-body d-flex flex-column p-3">
          <!-- Product Name -->
          <h6 class="fw-bold text-truncate mb-1">{{ product.name }}</h6>

          <!-- Rating Stars -->
          <div class="mb-1">
            <ng-container *ngFor="let star of [1,2,3,4,5]; let i = index">
              <i class="bi" [ngClass]="i < (product.rating || 0) ? 'bi-star-fill text-warning' : 'bi-star text-secondary'"></i>
            </ng-container>
          </div>

          <!-- Short Description -->
          <p class="small text-muted mb-1">
{{ product.description?.slice(0, 60) }}{{ product.description && product.description.length > 60 ? '…' : '' }}
          </p>

          <!-- Price -->
          <p class="fw-bold text-success mb-2">{{ product.price | currency }}</p>

          <!-- Add to Cart button with spinner -->
          <button class="btn btn-sm btn-primary mt-auto rounded-pill d-flex align-items-center justify-content-center"
                  (click)="addToCart(product)"
                  [disabled]="addingToCart[product.id || '']">
            <span *ngIf="addingToCart[product.id || '']" class="spinner-border spinner-border-sm me-2"></span>
            <span>{{ addingToCart[product.id || ''] ? 'Adding...' : '🛒 Add to Cart' }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .hover-shadow:hover {
    transform: translateY(-6px);
    transition: 0.2s ease-in-out;
    box-shadow: 0 6px 25px rgba(0,0,0,0.15);
  }
</style>
