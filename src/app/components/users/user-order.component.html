<div class="container my-4">

  <h3 class="mb-4">🛒 My Orders</h3>

  <div *ngIf="orders.length === 0" class="alert alert-info text-center">
    You have no orders yet.
  </div>

  <div *ngFor="let order of orders" class="card mb-3 shadow-sm rounded-4">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="mb-0">Order #{{ order.friendlyId }}</h5>
        <span class="badge"
              [ngClass]="{
                'bg-primary': order.status === 'new',
                'bg-warning text-dark': order.status === 'processing',
                'bg-success': order.status === 'completed'
              }">{{ order.status | titlecase }}</span>
      </div>

      <div class="text-muted small mb-2">Date: {{ order.date | date:'mediumDate' }}</div>

      <div class="mb-2">
        <strong>Payment:</strong>
        <span *ngIf="order.payment">Rs. {{ order.payment }}</span>
        <span *ngIf="!order.payment" class="text-muted">Pending</span>
      </div>

      <div class="mb-2">
        <strong>Total:</strong> Rs. {{ order.total }}
      </div>

      <div class="mb-2">
        <strong>Items:</strong>
        <ul class="list-group list-group-flush">
          <li *ngFor="let item of order.items" class="list-group-item d-flex justify-content-between align-items-center">
            {{ item.name }} × {{ item.quantity }}
            <span class="fw-bold">Rs. {{ item.price * item.quantity }}</span>
          </li>
        </ul>
      </div>
    </div>
  </div>

</div>

<style>
.card {
  transition: transform 0.2s ease-in-out;
}
.card:hover {
  transform: scale(1.02);
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
}
.badge {
  font-size: 0.9rem;
  text-transform: uppercase;
}
</style>
