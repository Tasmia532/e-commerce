<div class="container my-4">

  <!-- Selected Product Card -->
  <div *ngIf="selectedItem" class="card mb-4 shadow-sm rounded-4 p-3 border border-primary">
    <div class="row align-items-center">
      <div class="col-md-4 text-center">
        <img [src]="selectedItem.imageUrl || 'assets/no-image.png'" class="img-fluid rounded" style="max-height: 200px;">
      </div>
      <div class="col-md-8">
        <h5 class="fw-bold">{{ selectedItem.name }}</h5>
        <p class="text-success fw-bold">Rs. {{ selectedItem.price }}</p>
        <div class="d-flex gap-2 mt-2">
          <button class="btn btn-primary" (click)="addToCart(selectedItem)">Add to Cart</button>
          <button class="btn btn-success" (click)="buyNow(selectedItem)">Buy Now</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Order Placed Message -->
  <div *ngIf="orderPlacedMessage" class="alert alert-info text-center fw-semibold">
    {{ orderPlacedMessage }}
  </div>

  <!-- Cart Items -->
  <div *ngIf="cartItems.length > 0">
    <h5 class="mb-3">Cart Items</h5>
    <div *ngFor="let item of cartItems" class="d-flex align-items-center justify-content-between mb-2 p-2 border rounded shadow-sm"
         [ngClass]="{'border-primary': selectedItem?.id === item.id}">
      <div class="d-flex align-items-center gap-2" (click)="selectItem(item)" style="cursor:pointer;">
        <img [src]="item.imageUrl || 'assets/no-image.png'" class="rounded" style="height: 50px;">
        <div>
          <h6 class="mb-0">{{ item.name }}</h6>
          <small class="text-success fw-bold">Rs. {{ item.price }} x {{ item.quantity }}</small>
        </div>
      </div>
      <div class="d-flex gap-1">
        <button class="btn btn-outline-secondary btn-sm" (click)="decreaseQuantity(item)">-</button>
        <button class="btn btn-outline-secondary btn-sm" (click)="increaseQuantity(item)">+</button>
        <button class="btn btn-danger btn-sm" (click)="removeItem(item)">Remove</button>
      </div>
    </div>

    <hr>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5>Total: Rs. {{ getTotal() }}</h5>
      <button class="btn btn-warning" (click)="clearCart()">Clear Cart</button>
    </div>

    <!-- Checkout Button -->
    <div class="text-end mb-4">
      <button class="btn btn-lg btn-success" (click)="toggleCheckout()">Proceed to Checkout</button>
    </div>

   <!-- Checkout Form -->
<div *ngIf="showCheckoutForm" class="mb-4">
  <form #checkoutForm="ngForm" (ngSubmit)="placeOrder(checkoutForm)">
    
    <div class="mb-2">
      <input type="text" name="name" [(ngModel)]="checkoutData.name" placeholder="Full Name" required class="form-control" />
    </div>

    <div class="mb-2">
      <input type="email" name="email" [(ngModel)]="checkoutData.email" placeholder="Email" required class="form-control" />
    </div>

    <div class="mb-2">
      <input type="text" name="address" [(ngModel)]="checkoutData.address" placeholder="Address" required class="form-control" />
    </div>

    <div class="mb-2">
      <input type="tel" name="phone" [(ngModel)]="checkoutData.phone" placeholder="Phone Number" required class="form-control" />
    </div>
<!-- Payment Method -->
<div class="mb-2">
  <select class="form-control" name="paymentMethod" ngModel required>
    <option value="" disabled selected>Select Payment Method</option>
    <option value="cod">Cash on Delivery</option>
    <option value="card">Credit/Debit Card</option>
    <option value="bank">Bank Transfer</option>
  </select>
</div>





    <button type="submit" class="btn btn-success w-100 mt-2">Place Order</button>
  </form>
</div>


  <!-- Explore More Products - OUTSIDE Checkout Form -->
  <div class="mt-4">
    <h5 class="mb-3">Explore More Products</h5>
    <div class="row g-3">
      <div class="col-md-3" *ngFor="let product of allProducts" style="cursor:pointer;">
        <div class="card h-100 shadow-sm rounded-4 p-2 text-center"
             [ngClass]="{'border-primary': selectedItem?.id === product.id}"
             (click)="selectItem(product)">
          <img [src]="product.imageUrl || 'assets/no-image.png'" 
               class="card-img-top rounded mb-2" 
               style="height: 120px; object-fit: cover;">
          <button class="btn btn-sm btn-primary w-100">Select</button>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
.card img {
  object-fit: cover;
  transition: transform 0.2s ease-in-out;
}
.card:hover img {
  transform: scale(1.05);
}
.border-primary {
  border-width: 2px !important;
}
</style>
