<h2>🛒 Admin Dashboard</h2>

<!-- Add Product Form -->
<div>
  <h3>➕ Add Product</h3>
  <form (ngSubmit)="addProduct()">
    <input [(ngModel)]="newProduct.name" name="name" placeholder="Product Name" required />
    <input [(ngModel)]="newProduct.description" name="description" placeholder="Description" />
    <input [(ngModel)]="newProduct.price" name="price" type="number" placeholder="Price" required />
    <input [(ngModel)]="newProduct.quantity" name="quantity" type="number" placeholder="Quantity" required />
    <input [(ngModel)]="newProduct.imageUrl" name="imageUrl" placeholder="Image URL (optional)" />
    <button type="submit">Add Product</button>
  </form>
</div>

<!-- Product List -->
<div>
  <h3>📦 All Products</h3>
  <ul>
    <li *ngFor="let p of products">
      {{ p.name }} - Rs {{ p.price }} (Qty: {{ p.quantity }})
      <button (click)="deleteProduct(p.id!)">Delete</button>
    </li>
  </ul>
</div>

<!-- Orders Section -->
<div>
  <h3>📋 Orders</h3>
  <div *ngFor="let order of orders" class="order-card">
    <p><strong>Order ID:</strong> {{ order.id }}</p>
    <p><strong>Status:</strong> {{ order.status }}</p>
    <p><strong>Total:</strong> Rs {{ order.total }}</p>
    <p><strong>Items:</strong></p>
    <ul>
      <li *ngFor="let item of order.items">
        {{ item.name }} (x{{ item.quantity }}) - Rs {{ item.price }}
      </li>
    </ul>

<!-- Status Badge Display -->
<p class="mt-2">
  <span
    [ngClass]="{
      'badge-new': order.status === 'new',
      'badge-processing': order.status === 'processing',
      'badge-completed': order.status === 'completed'
    }"
    class="inline-block px-2 py-1 text-white text-xs rounded"
  >
    {{ order.status }}
  </span>
</p>




    <!-- 🗑️ Delete Order button -->
    <button (click)="deleteOrder(order.id)">Delete Order</button>

    <hr />
  </div>
</div>
